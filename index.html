<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital sovereignty questionnaire — Home</title>
<style>
  :root{
    --red:#D11A45; --magenta:#A72162; --purple:#7C2780; --violet:#512E9E;
    --grad:linear-gradient(90deg,#D11A45 0%,#A72162 34%,#7C2780 67%,#512E9E 100%);
    --ink:#1f2330; --ink2:#5b6072; --line:#e4e4ea; --card:#ffffff;
    --radius:8px;
    --font:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 20px;position:relative;overflow:hidden;background:#f6f6f9;
  }

  /* --- Blurred "shop window" backdrop: soft brand-colored blobs, heavily blurred --- */
  .backdrop{position:fixed;inset:0;z-index:0;overflow:hidden}
  .backdrop span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
  .backdrop span.b1{width:520px;height:520px;background:var(--red);top:-140px;left:-120px}
  .backdrop span.b2{width:460px;height:460px;background:var(--violet);bottom:-160px;right:-100px}
  .backdrop span.b3{width:380px;height:380px;background:var(--magenta);top:35%;left:55%;transform:translate(-50%,-50%)}
  .backdrop span.b4{width:300px;height:300px;background:var(--purple);bottom:10%;left:8%}
  @media(max-width:560px){
    .backdrop span{filter:blur(60px)}
  }

  /* Frosted glass pane sitting over the blur, like looking through a shop window */
  .pane{
    position:relative;z-index:1;width:100%;max-width:640px;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    backdrop-filter:blur(22px) saturate(150%);
    border:1px solid rgba(255,255,255,.7);
    border-radius:16px;
    box-shadow:0 20px 60px rgba(31,35,48,.16), inset 0 1px 0 rgba(255,255,255,.9);
    padding:44px 40px 40px;
    text-align:center;
  }
  @media(max-width:560px){ .pane{padding:32px 22px 28px} }

  .langtoggle{position:absolute;top:16px;right:16px;display:inline-flex;border:1px solid var(--line);
              border-radius:999px;overflow:hidden;background:#fff}
  .langtoggle button{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:700;
                     color:var(--ink2);padding:6px 15px;cursor:pointer;letter-spacing:.03em}
  .langtoggle button.on{background:var(--grad);color:#fff}

  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;
           letter-spacing:.09em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
  .eyebrow::before{content:"";width:32px;height:3px;border-radius:2px;background:var(--grad)}

  h1{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:0 0 12px}
  h1 .grad{color:var(--violet)}
  @supports((-webkit-background-clip:text) or (background-clip:text)){
    h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;
             -webkit-text-fill-color:transparent;color:transparent}
  }
  @media(max-width:560px){h1{font-size:24px}}

  p.lead{margin:0 auto 30px;color:var(--ink2);font-size:15px;line-height:1.62;max-width:480px}

  .choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .choice{
    flex:1;min-width:220px;max-width:260px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 18px;text-decoration:none;color:var(--ink);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .choice:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,35,48,.14);border-color:transparent}
  .choice .tag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
               color:#fff;background:var(--grad);padding:4px 10px;border-radius:999px}
  .choice .name{font-size:17px;font-weight:700}
  .choice .desc{font-size:13px;color:var(--ink2);line-height:1.5}
  .choice .go{font-size:13px;font-weight:600;color:var(--violet);margin-top:2px}
  .choice .go::after{content:" →";transition:margin-left .18s ease}
  .choice:hover .go::after{margin-left:3px}

  footer.note{margin-top:28px;font-size:12px;color:var(--ink2)}
</style>
</head>
<body>

  <div class="backdrop">
    <span class="b1"></span>
    <span class="b2"></span>
    <span class="b3"></span>
    <span class="b4"></span>
  </div>

  <main class="pane">
    <div class="langtoggle"><button id="langFR">FR</button><button id="langEN" class="on">EN</button></div>

    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>

    <div class="choices">
      <a class="choice" href="express-diagnostic.html">
        <span class="tag" id="tag1"></span>
        <span class="name" id="name1"></span>
        <span class="desc" id="desc1"></span>
        <span class="go" id="go1"></span>
      </a>
      <a class="choice" href="complete-framework.html">
        <span class="tag" id="tag2"></span>
        <span class="name" id="name2"></span>
        <span class="desc" id="desc2"></span>
        <span class="go" id="go2"></span>
      </a>
    </div>

    <footer class="note" id="note"></footer>
  </main>

<script>
var UI={
 en:{eyebrow:"Maturity self-assessment",
  title:'Digital Sovereignty <span class="grad">Questionnaire</span>',
  lead:'Two versions of the questionnaire are available. Choose the one you want to use — everything runs <strong>100% locally in your browser</strong>, with no data sent anywhere.',
  tag1:"Express",name1:"Express Diagnostic",desc1:"A quick self-assessment to get a first read on your digital sovereignty.",
  tag2:"Complete",name2:"Complete Framework",desc2:"6 pillars, 31 controls, 93 questions — the full assessment framework.",
  go:"Start",note:"No data ever leaves your device."},
 fr:{eyebrow:"Auto-évaluation de maturité",
  title:'Questionnaire de <span class="grad">souveraineté numérique</span>',
  lead:"Deux versions du questionnaire sont disponibles. Choisissez celle que vous souhaitez utiliser — l'ensemble se déroule <strong>100% localement dans votre navigateur</strong>, sans envoi de données.",
  tag1:"Express",name1:"Diagnostic Express",desc1:"Une auto-évaluation rapide pour un premier état des lieux de votre souveraineté numérique.",
  tag2:"Complet",name2:"Framework Complet",desc2:"6 piliers, 31 contrôles, 93 questions — le référentiel d'évaluation complet.",
  go:"Commencer",note:"Aucune donnée ne quitte votre appareil."}
};

var LANG="en";
try{var _ls=localStorage.getItem("qsov_lang");if(_ls==="en"||_ls==="fr")LANG=_ls;}catch(e){}

function ui(k){return UI[LANG][k];}

function applyI18n(){
  document.documentElement.lang=LANG;
  document.getElementById("eyebrow").textContent=ui("eyebrow");
  document.getElementById("title").innerHTML=ui("title");
  document.getElementById("lead").innerHTML=ui("lead");
  document.getElementById("tag1").textContent=ui("tag1");
  document.getElementById("name1").textContent=ui("name1");
  document.getElementById("desc1").textContent=ui("desc1");
  document.getElementById("tag2").textContent=ui("tag2");
  document.getElementById("name2").textContent=ui("name2");
  document.getElementById("desc2").textContent=ui("desc2");
  document.getElementById("go1").textContent=ui("go");
  document.getElementById("go2").textContent=ui("go");
  document.getElementById("note").textContent=ui("note");
  var gFR=document.getElementById("langFR"), gEN=document.getElementById("langEN");
  gFR.classList.toggle("on",LANG==="fr");
  gEN.classList.toggle("on",LANG==="en");
}

function setLang(l){
  if(l!=="fr"&&l!=="en")return;
  LANG=l;
  try{localStorage.setItem("qsov_lang",l);}catch(e){}
  applyI18n();
}

document.getElementById("langFR").addEventListener("click",function(){setLang("fr");});
document.getElementById("langEN").addEventListener("click",function(){setLang("en");});

applyI18n();
</script>

</body>
</html>
